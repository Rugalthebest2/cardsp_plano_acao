<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04070b">
<title>Prometeus — Ações</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Jost:wght@300;400&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#04070b;--p:#0b141a;--p2:#101c24;--ln:#1d3440;--ink:#e6fbff;--dim:#8fb4be;--cy:#3de8f5;--mg:#e94cf0;--vi:#b44cff;--ok:#5dffa8;
--gc:0 0 8px rgba(61,232,245,.6),0 0 22px rgba(61,232,245,.25);--gm:0 0 8px rgba(233,76,240,.7),0 0 24px rgba(180,76,255,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif}
body{min-height:100vh;background-image:linear-gradient(rgba(61,232,245,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(61,232,245,.04) 1px,transparent 1px),radial-gradient(800px 400px at 50% -5%,rgba(180,76,255,.18),transparent 60%);background-size:36px 36px,36px 36px,auto;padding-top:env(safe-area-inset-top)}
.led{height:4px;background:linear-gradient(90deg,transparent,var(--vi),var(--mg),var(--vi),transparent);background-size:200% 100%;animation:run 2.5s linear infinite,blink 1.2s ease-in-out infinite;box-shadow:var(--gm)}
@keyframes run{to{background-position:-200% 0}}
@keyframes blink{50%{opacity:.35}}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 80px}
.top{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.brand{text-align:center}
.brand svg{height:150px;width:auto;display:block;margin:0 auto;filter:drop-shadow(0 0 7px rgba(233,76,240,.75))}
.brand b{display:block;font:500 clamp(34px,9vw,60px) Cinzel,Georgia,serif;letter-spacing:.12em;line-height:1.1;color:var(--cy);text-shadow:0 0 6px rgba(61,232,245,.9),0 0 22px rgba(61,232,245,.45);margin-top:6px}
.brand .ln{width:min(520px,80vw);height:14px;margin:4px auto 6px;display:block}
.brand small{font:300 clamp(11px,3vw,16px) Jost,sans-serif;letter-spacing:.5em;color:#8fdde6;text-shadow:0 0 8px rgba(61,232,245,.4)}
.ob{font:11px ui-monospace,Consolas,monospace;padding:6px 12px;border-radius:20px;border:1px solid var(--mg);color:var(--mg);box-shadow:0 0 10px rgba(233,76,240,.3);display:inline-flex;gap:7px;align-items:center}
.ob i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;animation:blink 1.6s infinite}
.ob.on{border-color:var(--ok);color:var(--ok);box-shadow:0 0 12px rgba(93,255,168,.35)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 18px}
.btn{font:700 13px ui-monospace,Consolas,monospace;padding:11px 16px;min-height:42px;border-radius:8px;border:1px solid var(--ln);background:transparent;color:var(--dim);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--cy);color:var(--cy);box-shadow:var(--gc)}
.btn.pri{background:linear-gradient(135deg,var(--mg),var(--vi));border-color:var(--mg);color:#fff;box-shadow:var(--gm);margin-right:auto}
.btn.pri:hover{filter:brightness(1.15);color:#fff}
.btn.on{border-color:var(--cy);color:var(--cy);box-shadow:var(--gc)}
.btn.dan{border-color:rgba(255,90,110,.5);color:#ff6b7e}
.btn.dan:hover{border-color:#ff6b7e;color:#ff6b7e;box-shadow:0 0 10px rgba(255,90,110,.5)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:16px 16px 14px;cursor:pointer;position:relative;transition:.2s;--c:var(--mg)}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c);box-shadow:0 0 10px var(--c)}
.card:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 40%,transparent)}
.card.andamento{--c:var(--cy)}.card.concluido{--c:var(--ok)}
.card h3{margin:0 0 6px;font-size:16px;line-height:1.3}
.card p{margin:0 0 12px;color:var(--dim);font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .ft{display:flex;justify-content:space-between;align-items:center;font:11px ui-monospace,monospace;color:var(--dim)}
.tag{padding:3px 10px;border-radius:12px;border:1px solid var(--c);color:var(--c);text-shadow:0 0 6px var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:var(--dim)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto;z-index:50}
.mo[hidden]{display:none}
.md{background:var(--p);border:1px solid var(--vi);box-shadow:var(--gm);border-radius:14px;width:100%;max-width:520px;padding:20px}
.md h2{margin:0 0 14px;font-size:14px;letter-spacing:.12em;color:var(--mg);text-transform:uppercase;text-shadow:0 0 8px var(--mg)}
label{display:block;font:11.5px ui-monospace,monospace;color:var(--dim);margin:12px 0 6px}
input,textarea{width:100%;background:#060d12;border:1px solid var(--ln);border-radius:8px;color:var(--ink);font:inherit;font-size:15px;padding:11px 12px;outline:none;color-scheme:dark}
input:focus,textarea:focus{border-color:var(--cy);box-shadow:var(--gc)}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.row .btn{flex:1}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.st .btn{padding:10px 4px;font-size:12px}
.st .btn[data-s=pendente].on{border-color:var(--mg);color:var(--mg);box-shadow:var(--gm)}
.st .btn[data-s=concluido].on{border-color:var(--ok);color:var(--ok);box-shadow:0 0 10px rgba(93,255,168,.5)}
.card.urg{--c:#ff2e4d;animation:ug 1.4s ease-in-out infinite}
@keyframes ug{50%{box-shadow:0 0 24px rgba(255,46,77,.6);border-color:#ff2e4d}}
.card.urg.concluido{--c:#ffc83d;animation:none;box-shadow:0 0 16px rgba(255,200,61,.4)}
select{background:#060d12;border:1px solid var(--ln);border-radius:8px;color:var(--ink);font:inherit;font-size:14px;padding:11px 10px;outline:none;color-scheme:dark;max-width:100%}
select:focus{border-color:var(--cy);box-shadow:var(--gc)}
.ets{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.ets:empty{display:none}
.et{font:11px ui-monospace,monospace;padding:3px 10px;border-radius:12px;border:1px solid var(--k);color:var(--k);background:color-mix(in srgb,var(--k) 10%,transparent);text-shadow:0 0 6px var(--k);display:inline-flex;align-items:center;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer;opacity:.45;font-size:12.5px;padding:6px 12px}.chip.on{opacity:1;box-shadow:0 0 10px var(--k)}
.xx{background:none;border:0;color:inherit;cursor:pointer;font-size:16px;padding:0 0 0 4px}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;max-height:180px;overflow:auto;padding:2px}
.emo button{font-size:21px;background:#060d12;border:1px solid var(--ln);border-radius:8px;padding:6px;cursor:pointer}
.emo button.on{border-color:var(--cy);box-shadow:var(--gc)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:32px;height:32px;border-radius:50%;border:2px solid transparent;background:var(--k);box-shadow:0 0 10px var(--k);cursor:pointer}
.sw button.on{border-color:#fff}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.kp div{background:#060d12;border:1px solid var(--ln);border-radius:10px;padding:10px;text-align:center;font:11px ui-monospace,monospace;color:var(--dim)}
.kp b{display:block;font-size:24px;color:var(--cy);text-shadow:var(--gc)}
.ri{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--ln);border-left:3px solid var(--ok);border-radius:8px;margin-bottom:8px;font-size:14px}
.ri.g{border-left-color:#ffc83d}
.bar[hidden]{display:none}
#mais{font-size:20px;padding:0;width:42px;transition:.2s}
#mais.on{transform:rotate(45deg);border-color:var(--mg);color:var(--mg);box-shadow:var(--gm)}
.card .ft .tag{margin-left:auto;text-align:right}
#foco{position:fixed;inset:0;z-index:60;background:radial-gradient(900px 600px at 50% 50%,rgba(180,76,255,.14),transparent 70%),rgba(2,4,7,.96);display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden}
#foco[hidden]{display:none}
.fc{--c:var(--mg);width:100%;max-width:640px;max-height:88vh;overflow:auto;text-align:center;background:rgba(11,20,26,.92);border:2px solid var(--c);border-radius:18px;padding:28px 22px;position:relative;z-index:2;animation:fp 1.6s ease-in-out infinite}
.fc.andamento{--c:var(--cy)}.fc.concluido{--c:var(--ok)}.fc.urg{--c:#ff2e4d}.fc.urg.concluido{--c:#ffc83d}
@keyframes fp{0%,100%{box-shadow:0 0 14px var(--c),0 0 36px color-mix(in srgb,var(--c) 40%,transparent)}50%{box-shadow:0 0 34px var(--c),0 0 90px color-mix(in srgb,var(--c) 60%,transparent)}}
.fk{font:11px ui-monospace,monospace;letter-spacing:.3em;color:var(--c);text-shadow:0 0 8px var(--c);margin-bottom:14px}
.fc h1{margin:0 0 12px;font:700 clamp(22px,5.5vw,38px) Orbitron,sans-serif;letter-spacing:.06em;color:var(--ink);text-shadow:0 0 14px var(--c)}
.fc p{white-space:pre-wrap;color:var(--dim);font-size:16px;line-height:1.55;margin:0 0 16px}
.fr{position:absolute;top:0;max-width:80vw;text-align:center;font:500 clamp(16px,3.6vw,28px) Orbitron,sans-serif;letter-spacing:.08em;color:#5dffa8;text-shadow:0 0 8px #5dffa8,0 0 26px rgba(93,255,168,.7);animation:fm 14s linear forwards;pointer-events:none;z-index:1;opacity:0}
#fctl{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;z-index:3;opacity:.35;transition:.2s;padding:6px 14px;border-radius:20px}
#fctl:hover,#fctl:focus-within{opacity:1}
#fctl button{background:none;border:0;color:#7b9ca6;font-size:18px;cursor:pointer;padding:4px 6px;line-height:1}
#fctl button.on{color:#5dffa8;text-shadow:0 0 8px #5dffa8}
#fctl input{width:72px;padding:0;border:0;background:none;box-shadow:none;accent-color:#5dffa8;min-height:0}
#fctl input:focus{box-shadow:none}
#foco.so .fc{display:none}
@keyframes fm{0%{opacity:0;transform:translate(-50%,-10vh)}12%{opacity:.95}85%{opacity:.95}100%{opacity:0;transform:translate(-50%,105vh)}}
.card.arq{opacity:.55}
.hd{align-self:flex-end;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.coin{font:700 13px ui-monospace,Consolas,monospace;padding:6px 12px;border-radius:20px;border:1px solid #ffc83d;color:#ffd96b;text-shadow:0 0 8px rgba(255,200,61,.8);box-shadow:0 0 12px rgba(255,200,61,.35);display:inline-flex;gap:6px;align-items:center}
.coin.pop{animation:pp .25s}
@keyframes pp{50%{transform:scale(1.3)}}
.fly{position:fixed;top:55vh;font-size:44px;z-index:99;pointer-events:none;filter:drop-shadow(0 0 10px #ffc83d);opacity:0;animation:fl 1.3s ease-out forwards}
@keyframes fl{0%{transform:translateY(0) scale(.5) rotateY(0);opacity:1}70%{opacity:1}100%{transform:translateY(-48vh) scale(1.1) rotateY(720deg);opacity:0}}
.btn.urg{border-color:rgba(255,46,77,.5);color:#ff6b7e}
.btn.urg.on{border-color:#ff2e4d;color:#ff4d68;background:rgba(255,46,77,.1);box-shadow:0 0 12px rgba(255,46,77,.6)}
.card .im{height:120px;margin:-4px -4px 10px;border-radius:8px;overflow:hidden;position:relative;background:#060d12}
.card .im img{width:100%;height:100%;object-fit:cover;display:block}
.card .im span{position:absolute;right:6px;bottom:6px;font:11px ui-monospace,monospace;background:rgba(4,7,11,.85);color:var(--cy);border:1px solid var(--cy);border-radius:10px;padding:2px 8px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:12px}
.gal div{position:relative;border:1px solid var(--ln);border-radius:8px;overflow:hidden;aspect-ratio:1}
.gal img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.gal button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:1px solid #ff6b7e;background:rgba(4,7,11,.85);color:#ff6b7e;cursor:pointer}
#lbi{max-width:100%;max-height:88vh;margin:auto;border-radius:10px;box-shadow:var(--gc)}
.det{white-space:pre-wrap;color:var(--dim);font-size:14px;line-height:1.5;background:#060d12;border:1px solid var(--ln);border-radius:8px;padding:12px}
</style>
</head>
<body>
<div class="led"></div>
<div class="wrap">
  <div class="top">
    <div class="hd"><span class="coin" id="coin">🪙 <b id="cn">0</b></span><span class="ob" id="ob"><i></i>conectando...</span></div>
    <div class="brand">
      <svg viewBox="205 245 640 580" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <ellipse cx="550" cy="808" rx="70" ry="9" fill="#3de8f5" opacity=".35"/>
        <g fill="rgba(180,76,255,.32)" stroke="none"><path d="M547 265 611 413 567 428 545 350Z"/><path d="M428 467 449 521 480 591 370 635Z"/><path d="M370 635 480 591 449 708Z"/><path d="M649 459 721 599 724 685 601 571 625 516Z"/><path d="M655 690 724 685 680 747 610 807Z"/></g>
        <g stroke="#3de8f5" stroke-width="5"><path d="M491 807H450L420 778H227V640"/><path d="M370 635 343 602V558L372 529V498"/><path d="M724 659 768 629V579L795 551"/><path d="M724 685H762"/><path d="M610 807H657L686 782H737"/></g>
        <g stroke="#b44cff" stroke-width="5"><path d="M385 713 359 740H294L271 717V660L301 630V559"/><path d="M691 536 731 518V442L760 414V373"/><path d="M739 553V478"/><path d="M724 599 777 548V458L825 410"/></g>
        <g stroke="#3de8f5" stroke-width="5" fill="#04070b"><circle cx="227" cy="631" r="9"/><circle cx="372" cy="489" r="9"/><circle cx="800" cy="546" r="9"/><circle cx="771" cy="686" r="9"/><circle cx="746" cy="782" r="9"/></g>
        <g stroke="#b44cff" stroke-width="5" fill="#04070b"><circle cx="301" cy="550" r="9"/><circle cx="760" cy="364" r="9"/><circle cx="739" cy="469" r="9"/><circle cx="833" cy="402" r="9"/></g>
        <g stroke="#ee50f5" stroke-width="7"><path d="M547 265 611 413 625 516 649 459 721 599 724 685 680 747 610 807M491 807 415 755 370 635 428 467 449 521 470 450 545 350 547 265"/></g>
        <g stroke="#ee50f5" stroke-width="5"><path d="M545 350 567 428 611 413M545 350 509 485M470 450 509 485 571 592 601 571 625 516M428 467 449 521 480 591 449 708 491 807M480 591 449 708 415 755M370 635 449 708M601 571 724 685M601 571 655 690 724 685M655 690 610 807M655 690 680 747M601 571 649 459"/></g>
        <path d="M370 635 480 591 509 485 567 428" stroke="#c9d8ff" stroke-width="5"/>
        <g fill="#fff"><circle cx="547" cy="265" r="8"/><circle cx="480" cy="591" r="7"/><circle cx="491" cy="807" r="7"/><circle cx="610" cy="807" r="7"/></g>
      </svg>
      <b>PROMETEUS</b>
      <svg class="ln" viewBox="0 0 520 14" fill="none" stroke="#3de8f5" stroke-width="1.6"><path d="M9 7H210L222 13H298L310 7H511"/><circle cx="7" cy="7" r="5" fill="#04070b"/><circle cx="513" cy="7" r="5" fill="#04070b"/></svg>
      <small>FERRAMENTAS DIGITAIS</small>
    </div>
  </div>

  <div class="bar">
    <button class="btn pri" id="novo">+ Nova ação</button>
    <button class="btn on" data-f="todos">Todas <span id="c-todos">0</span></button>
    <button class="btn" data-f="pendente">Pendente <span id="c-pendente">0</span></button>
    <button class="btn" data-f="andamento">Em andamento <span id="c-andamento">0</span></button>
    <button class="btn" data-f="concluido">Concluído <span id="c-concluido">0</span></button>
    <button class="btn" data-f="arquivado">Arquivadas <span id="c-arquivado">0</span></button>
    <button class="btn" id="mais" title="Mais opções">+</button>
      </div>
  <div class="bar" id="ext" hidden style="margin:0 0 16px">
    <input id="q" placeholder="🔎 Buscar ação..." style="flex:1;min-width:180px;width:auto">
    <select id="so"><option value="urg">🔥 Urgentes primeiro</option><option value="rec">🕒 Mais recentes</option><option value="ant">🕰 Mais antigas</option><option value="prz">📅 Prazo mais próximo</option><option value="az">🔤 A–Z</option></select>
    <select id="ft"></select>
    <button class="btn" id="rs">📅 Resumo do dia</button><button class="btn" id="cf">⚙ Configurações</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- Modal: nova ação -->
<div class="mo" id="mNovo" hidden><div class="md">
  <h2 id="mh">Nova ação</h2>
  <label>Título *</label><input id="t" placeholder="Ex.: Enviar proposta ao cliente">
  <label>Descrição</label><textarea id="d" placeholder="Detalhes da ação..."></textarea>
  <label>Prazo</label><input type="date" id="p">
  <label style="display:flex;gap:8px;align-items:center;cursor:pointer;color:#ff6b7e;font-size:13px"><input type="checkbox" id="u" style="width:20px;height:20px;accent-color:#ff2e4d">⚠ Marcar como URGENTE</label>
  <label>Etiquetas</label><div class="chips" id="fTags"></div>
  <label>Imagens</label><button class="btn" id="anx" type="button" style="width:100%">📎 Anexar imagens</button>
  <input type="file" id="fi" accept="image/*" multiple hidden><div class="gal" id="gN"></div>
  <div class="row"><button class="btn" data-x>Cancelar</button><button class="btn pri" id="salvar" style="margin:0">Criar ação</button></div>
</div></div>

<!-- Modal: detalhe da ação -->
<div class="mo" id="mDet" hidden><div class="md">
  <h2 id="dt"></h2>
  <div class="ets" id="dtg"></div><div class="det" id="dd"></div>
  <div class="gal" id="gD"></div>
  <button class="btn urg" id="ub" style="width:100%;margin-top:12px"></button>
  <div class="st">
    <button class="btn" data-s="pendente">Pendente</button>
    <button class="btn" data-s="andamento">Em andamento</button>
    <button class="btn" data-s="concluido">Concluído</button>
  </div>
  <input type="file" id="fi2" accept="image/*" multiple hidden>
  <div class="row"><button class="btn" id="fo">Foco</button><button class="btn" id="ed">✎ Editar</button><button class="btn" id="anx2">📎 Anexar</button><button class="btn" id="arq">Arquivar</button><button class="btn dan" id="del">Excluir</button><button class="btn" data-x>Fechar</button></div>
</div></div>

<div class="mo" id="lb" hidden><img id="lbi" alt=""></div>

<!-- Modal: configurações / etiquetas -->
<div class="mo" id="mCfg" hidden><div class="md">
  <h2>⚙ Configurações · Etiquetas</h2>
  <div class="ets" id="cl"></div>
  <label>Nova etiqueta</label><input id="tn" placeholder="Nome (ex.: Cliente)" maxlength="20">
    <label>Cor neon</label><div class="sw" id="sw"></div>
  <div class="row"><button class="btn" data-x>Fechar</button><button class="btn pri" id="addT" style="margin:0">Criar etiqueta</button></div>
  <h2 style="margin-top:26px">Frases do modo foco</h2>
  <div id="fl"></div>
  <label>Nova frase</label><input id="fn" placeholder="Ex.: A sorte favorece os audaciosos" maxlength="120">
  <div class="row"><button class="btn pri" id="addF" style="margin:0">Adicionar frase</button></div>
</div></div>

<!-- Modo foco absoluto -->
<div id="foco" hidden>
  <div class="fc" id="fcard">
        <h1 id="fT"></h1>
        <p id="fD"></p>
    <div class="st"><button class="btn" data-s="pendente">Pendente</button><button class="btn" data-s="andamento">Em andamento</button><button class="btn" data-s="concluido">Concluído</button></div>
    <button class="btn" id="fX" style="width:100%">Sair do foco</button>
  </div>
  <div id="fctl">
    <button id="cFr" title="Mostrar frases">❝</button>
    <input type="range" id="cVel" min="1" max="5" step="1" value="3" title="Velocidade das frases">
    <button id="cSo" title="Só frases">◻</button>
    <button id="cX" title="Sair do foco">✕</button>
  </div>
</div>

<!-- Modal: resumo do dia -->
<div class="mo" id="mRes" hidden><div class="md" style="max-width:600px">
  <h2>📅 Resumo do dia</h2>
  <input type="date" id="rd">
  <div class="kp" id="rk"></div>
  <div id="rl"></div>

<script>
(function(){

  }).join(""):'<div class="empty">Nenhuma ação aqui. Clique em <b>+ Nova ação</b>.</div>';
}
function abrirDet(id){
  atual=A.filter(function(a){return a.id===id})[0];if(!atual)return;
  $("dt").textContent=atual.titulo;$("dtg").innerHTML=tg(atual);
  $("dd").textContent=(atual.desc||"Sem descrição")+(atual.prazo?"\n\nPrazo: "+atual.prazo.split("-").reverse().join("/"):"");

}
/* ---- etiquetas, busca/ordem e resumo do dia ---- */
var EMO=["🔥","💎","🔮","⚡","🚀","🛰️","🤖","💡","🧬","🔧","⚙️","🛠️","🧠","🎯","📌","📎","📊","📈","💾","🖥️","📱","🔒","🔑","🛡️","⭐","🏆","💰","🪙","📞","✉️","📅","⏰","🚨","✅","🧪","🔬","🌐","📡","🔌","🔋","👾","🎮","🌙","✨","💜","💙","🩵","🧿","🏗️","📦","🚚","🧾","📝","🧩","🔭","💬"];
var COR=["#3de8f5","#e94cf0","#b44cff","#5dffa8","#ffc83d","#4d9bff","#ff9a3d"];
var DEF=["A sorte favorece os audaciosos","Foco é a ponte entre a ideia e o resultado","Um passo de cada vez, mas sem parar","Disciplina vence a motivação","O que você faz hoje constrói o amanhã"];
var CFG={id:"cfg_prometeus",frases:DEF.slice(),tags:[{id:"t1",nome:"Cliente",em:"💼",cor:"#3de8f5"},{id:"t2",nome:"Interno",em:"⚙️",cor:"#b44cff"},{id:"t3",nome:"Financeiro",em:"💰",cor:"#ffc83d"}]};
try{var sc=JSON.parse(localStorage.getItem("prometeus_cfg_v1"));if(sc&&sc.tags){CFG=sc;if(!CFG.frases)CFG.frases=DEF.slice()}}catch(e){}
var sel=[],pe=EMO[0],pc=COR[0],q="",sortBy="urg",fTag="";
function saveCfg(){try{localStorage.setItem("prometeus_cfg_v1",JSON.stringify(CFG))}catch(e){}dbSave(CFG,"config_prometeus")}
function tl(a){return (a.etqs||[]).map(function(id){return CFG.tags.filter(function(t){return t.id===id})[0]}).filter(Boolean)}
function tg(a){return tl(a).map(function(t){return '<span class="et" style="--k:'+t.cor+'">'+esc(t.nome)+'</span>'}).join("")}
function tn(a){return tl(a).map(function(t){return t.nome}).join(" ")}
function ord(a,b){var r=b.criado<a.criado?-1:1;
  if(sortBy==="rec")return r;if(sortBy==="ant")return -r;
  if(sortBy==="prz"){var x=a.prazo||"9999",y=b.prazo||"9999";return x<y?-1:x>y?1:r}
  if(sortBy==="az")return a.titulo.localeCompare(b.titulo);
  return (b.urgente?1:0)-(a.urgente?1:0)||r}
function selTags(){var s=$("ft");s.innerHTML='<option value="">Todas as etiquetas</option>'+CFG.tags.map(function(t){return '<option value="'+t.id+'">'+esc(t.nome)+'</option>'}).join("");s.value=fTag;fTag=s.value}
function chips(){$("fTags").innerHTML=CFG.tags.length?CFG.tags.map(function(t){return '<button type="button" class="et chip'+(sel.indexOf(t.id)>-1?" on":"")+'" style="--k:'+t.cor+'" data-t="'+t.id+'">'+esc(t.nome)+'</button>'}).join(""):'<span style="font-size:12px;color:#7b9ca6">Crie etiquetas em ⚙ Configurações.</span>'}
function cfgR(){
  $("fl").innerHTML=CFG.frases.map(function(f,i){return '<div class="ri" style="border-left-color:#b44cff"><span>'+esc(f)+'</span><button class="xx" data-f="'+i+'">&times;</button></div>'}).join("")||'<span style="font-size:12px;color:#7b9ca6">Nenhuma frase cadastrada.</span>';
  $("cl").innerHTML=CFG.tags.map(function(t){return '<span class="et" style="--k:'+t.cor+'">'+esc(t.nome)+'<button class="xx" data-d="'+t.id+'">&times;</button></span>'}).join("")||'<span style="font-size:12px;color:#7b9ca6">Nenhuma etiqueta criada.</span>';
    $("sw").innerHTML=COR.map(function(c){return '<button type="button" data-c="'+c+'" style="--k:'+c+'"'+(c===pc?' class="on"':"")+'></button>'}).join("")}
function ymd(d){var z=new Date(d);return z.getFullYear()+"-"+("0"+(z.getMonth()+1)).slice(-2)+"-"+("0"+z.getDate()).slice(-2)}
function resumo(){
  var d=$("rd").value,l=A.filter(function(a){return a.status==="concluido"&&a.concluidoEm&&ymd(a.concluidoEm)===d}).sort(function(a,b){return a.concluidoEm<b.concluidoEm?-1:1});
  var u=l.filter(function(a){return a.urgente}).length,m=l.reduce(function(s,a){return s+(a.pago||0)},0);
  $("rk").innerHTML='<div><b>'+l.length+'</b>concluídas</div><div><b style="color:#ff6b7e;text-shadow:0 0 8px #ff2e4d">'+u+'</b>urgentes</div><div><b style="color:#ffd96b;text-shadow:0 0 8px #ffc83d">'+m+'</b>🪙 moedas</div>';
  $("rl").innerHTML=l.length?l.map(function(a){var h=new Date(a.concluidoEm);
    return '<div class="ri'+(a.urgente?" g":"")+'"><span>'+(a.urgente?"⭐ ":"✅ ")+esc(a.titulo)+'<span class="ets" style="margin:6px 0 0">'+tg(a)+'</span></span><span style="font:11px ui-monospace,monospace;color:#8fb4be;white-space:nowrap">'+("0"+h.getHours()).slice(-2)+":"+("0"+h.getMinutes()).slice(-2)+" · +"+(a.pago||0)+"🪙</span></div>"}).join(""):'<div class="empty" style="padding:30px 0">Nenhuma ação concluída neste dia.</div>'}
$("q").oninput=function(){q=this.value.toLowerCase().trim();render()};
$("so").onchange=function(){sortBy=this.value;render()};
$("ft").onchange=function(){fTag=this.value;render()};
$("fTags").onclick=function(e){var b=e.target.closest("[data-t]");if(!b)return;var i=sel.indexOf(b.dataset.t);if(i>-1)sel.splice(i,1);else sel.push(b.dataset.t);chips()};
$("cf").onclick=function(){cfgR();$("mCfg").hidden=false};
$("sw").onclick=function(e){var b=e.target.closest("[data-c]");if(b){pc=b.dataset.c;cfgR()}};
$("addT").onclick=function(){var n=$("tn").value.trim();if(!n){$("tn").focus();return}
  CFG.tags.push({id:"t"+Date.now().toString(36),nome:n,cor:pc});$("tn").value="";saveCfg();cfgR();selTags();render()};
$("cl").onclick=function(e){var d=e.target.dataset.d;if(d){CFG.tags=CFG.tags.filter(function(t){return t.id!==d});saveCfg();cfgR();selTags();render()}};
$("rs").onclick=function(){$("rd").value=ymd(new Date());resumo();$("mRes").hidden=false};
$("rd").onchange=resumo;
$("mais").onclick=function(){var e=$("ext");e.hidden=!e.hidden;this.classList.toggle("on",!e.hidden)};
/* ---- frases (configuração) ---- */
$("addF").onclick=function(){var f=$("fn").value.trim();if(!f){$("fn").focus();return}CFG.frases.push(f);$("fn").value="";saveCfg();cfgR()};
$("fl").onclick=function(e){var i=e.target.dataset.f;if(i!=null){CFG.frases.splice(+i,1);saveCfg();cfgR()}};
/* ---- modo foco absoluto ---- */
var fq,FS={fr:true,vel:3,so:false};
try{var fs=JSON.parse(localStorage.getItem("prometeus_foco_v1"));if(fs&&fs.vel)FS=fs}catch(e){}
function dur(){return [0,24,18,14,10,7][FS.vel]||14}
function ciclo(){clearInterval(fq);if(FS.fr)fq=setInterval(frase,dur()*430)}
function ctl(){$("foco").classList.toggle("so",FS.so);$("cFr").classList.toggle("on",FS.fr);$("cSo").classList.toggle("on",FS.so);$("cVel").value=FS.vel;
  if(!FS.fr)document.querySelectorAll("#foco .fr").forEach(function(e){e.remove()});
  try{localStorage.setItem("prometeus_foco_v1",JSON.stringify(FS))}catch(e){}}
function focoR(){var a=atual;$("fcard").className="fc "+a.status+(a.urgente?" urg":"");$("fT").textContent=a.titulo;$("fD").textContent=a.desc||"";
    document.querySelectorAll("#fcard .st .btn").forEach(function(b){b.classList.toggle("on",b.dataset.s===a.status)})}
function frase(){if(!CFG.frases.length)return;var e=document.createElement("div");e.className="fr";e.textContent=CFG.frases[Math.floor(Math.random()*CFG.frases.length)];e.style.left=(30+Math.random()*40)+"%";e.style.animationDuration=dur()+"s";$("foco").appendChild(e);setTimeout(function(){e.remove()},dur()*1000+400)}
function abrirFoco(){$("mDet").hidden=true;focoR();$("foco").hidden=false;ctl();if(FS.fr)setTimeout(frase,1200);ciclo()}
function fechaFoco(){$("foco").hidden=true;clearInterval(fq);document.querySelectorAll("#foco .fr").forEach(function(e){e.remove()})}
$("fo").onclick=abrirFoco;$("fX").onclick=fechaFoco;$("cX").onclick=fechaFoco;
$("cFr").onclick=function(){FS.fr=!FS.fr;if(!FS.fr)FS.so=false;ctl();ciclo();if(FS.fr)frase()};
$("cSo").onclick=function(){FS.so=!FS.so;if(FS.so)FS.fr=true;ctl();ciclo();if(FS.so&&!document.querySelector("#foco .fr"))frase()};
$("cVel").oninput=function(){FS.vel=+this.value;ctl();ciclo()};
document.querySelectorAll("#fcard .st .btn").forEach(function(b){b.onclick=function(){document.querySelector('#mDet .st .btn[data-s="'+b.dataset.s+'"]').click();focoR()}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("foco").hidden)fechaFoco()});
selTags();
/* ---- moedas: ação concluída = 1 moeda, urgente = 2 (cada ação paga uma única vez) ---- */
var cnt=0,tm=0,ac;
function moedas(){if(!tm){cnt=A.reduce(function(s,a){return s+(a.pago||0)},0);$("cn").textContent=cnt}}
function som(n){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();
  for(var k=0;k<n;k++)(function(t){var o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.setValueAtTime(988,t);o.frequency.setValueAtTime(1319,t+.09);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.45);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.5)})(ac.currentTime+k*.26)}catch(e){}}
function pop(){var c=$("coin");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop")}
function ganhar(n){som(n);var t=cnt+n;clearInterval(tm);
  tm=setInterval(function(){cnt++;$("cn").textContent=cnt;pop();if(cnt>=t){clearInterval(tm);tm=0}},260)}
function voar(n){for(var k=0;k<n;k++){var e=document.createElement("div");e.className="fly";e.textContent="🪙";e.style.left=(42+k*10)+"vw";e.style.animationDelay=(k*.26)+"s";document.body.appendChild(e);setTimeout(function(x){x.remove()},1800,e)}}
/* ---- urgente / editar / arquivar ---- */
var edit=null;
function flags(){$("ub").classList.toggle("on",!!atual.urgente);$("ub").textContent=atual.urgente?"🔥 URGENTE — toque para remover":"⚠ Marcar como urgente";$("arq").textContent=atual.arquivado?"Desarquivar":"Arquivar"}
$("ub").onclick=function(){atual.urgente=!atual.urgente;cache();render();flags();dbSave(atual)};
$("arq").onclick=function(){atual.arquivado=!atual.arquivado;cache();render();dbSave(atual);$("mDet").hidden=true};
$("ed").onclick=function(){edit=atual;sel=(atual.etqs||[]).slice();chips();$("mh").textContent="Editar ação";$("salvar").textContent="Salvar alterações";$("t").value=atual.titulo;$("d").value=atual.desc||"";$("p").value=atual.prazo||"";$("u").checked=!!atual.urgente;nf=(atual.fotos||[]).slice();$("gN").innerHTML=gh(nf);$("mDet").hidden=true;$("mNovo").hidden=false};
/* ---- imagens (comprimidas e guardadas junto da ação) ---- */
var nf=[];
function comp(f){return new Promise(function(res){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.7))};im.onerror=function(){res(null)};im.src=r.result};r.onerror=function(){res(null)};r.readAsDataURL(f)})}
async function ler(fs){var o=[];for(var i=0;i<fs.length;i++){var d=await comp(fs[i]);if(d)o.push(d)}return o}
function gh(a){return a.map(function(s,i){return '<div><img src="'+s+'" data-z="'+i+'" alt=""><button data-r="'+i+'">&times;</button></div>'}).join("")}
function gal(){$("gD").innerHTML=gh(atual.fotos||[])}
function zoom(e,arr){var z=e.target.dataset.z;if(z!=null){$("lbi").src=arr[+z];$("lb").hidden=false}}
$("anx").onclick=function(){$("fi").click()};
$("fi").onchange=async function(){nf=nf.concat(await ler(this.files));this.value="";$("gN").innerHTML=gh(nf)};
$("gN").onclick=function(e){var r=e.target.dataset.r;if(r!=null){nf.splice(+r,1);$("gN").innerHTML=gh(nf)}else zoom(e,nf)};
$("anx2").onclick=function(){$("fi2").click()};
$("fi2").onchange=async function(){atual.fotos=(atual.fotos||[]).concat(await ler(this.files));this.value="";cache();render();gal();dbSave(atual)};
$("gD").onclick=function(e){var r=e.target.dataset.r;if(r!=null){atual.fotos.splice(+r,1);cache();render();gal();dbSave(atual)}else zoom(e,atual.fotos||[])};
$("lb").onclick=function(){this.hidden=true};
function marca(){document.querySelectorAll("#mDet .st .btn").forEach(function(b){b.classList.toggle("on",b.dataset.s===atual.status)})}

/* ---- eventos ---- */
$("grid").onclick=function(e){var c=e.target.closest(".card");if(c)abrirDet(c.dataset.id)};
$("novo").onclick=function(){edit=null;sel=[];chips();$("u").checked=false;$("mh").textContent="Nova ação";$("salvar").textContent="Criar ação";$("t").value=$("d").value=$("p").value="";nf=[];$("gN").innerHTML="";$("mNovo").hidden=false;$("t").focus()};
$("salvar").onclick=function(){
  var t=$("t").value.trim();if(!t){$("t").focus();return}
  var a={id:"a"+Date.now().toString(36),titulo:t,desc:$("d").value.trim(),prazo:$("p").value,fotos:nf.slice(),status:"pendente",criado:new Date().toISOString()};
  a.urgente=$("u").checked;a.etqs=sel.slice();if(edit){edit.titulo=a.titulo;edit.desc=a.desc;edit.prazo=a.prazo;edit.fotos=a.fotos;edit.urgente=a.urgente;edit.etqs=a.etqs;a=edit;edit=null}else A.push(a);cache();render();dbSave(a);$("mNovo").hidden=true;
};
document.querySelectorAll("#mDet .st .btn").forEach(function(b){b.onclick=function(){
  var prev=atual.status;atual.status=b.dataset.s;
  if(atual.status==="concluido"&&(prev!=="concluido"||!atual.concluidoEm))atual.concluidoEm=new Date().toISOString();
  if(atual.status==="concluido"&&!atual.pago){var g=atual.urgente?2:1;ganhar(g);voar(g);atual.pago=g}
  cache();render();marca();dbSave(atual);
}});
$("del").onclick=function(){if(confirm('Excluir "'+atual.titulo+'"?'+(atual.pago?" Você perderá as "+atual.pago+" moeda(s) dela. Para guardar as moedas, use Arquivar.":""))){A=A.filter(function(a){return a!==atual});cache();render();dbDel(atual.id);$("mDet").hidden=true}};
document.querySelectorAll("[data-x]").forEach(function(b){b.onclick=function(){b.closest(".mo").hidden=true}});
document.querySelectorAll(".mo").forEach(function(m){m.onclick=function(e){if(e.target===m)m.hidden=true}});
document.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){
  filtro=b.dataset.f;document.querySelectorAll("[data-f]").forEach(function(x){x.classList.toggle("on",x===b)});render();
}});

/* ---- início ---- */
try{A=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){A=[]}
render();
conectar().then(sync);
setInterval(sync,30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)sync()});
})();
</script>
