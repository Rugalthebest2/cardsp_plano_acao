<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04070b">
<title>Prometeus — Ações</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#04070b;--p:#0b141a;--p2:#101c24;--ln:#1d3440;--ink:#e6fbff;--dim:#8fb4be;--cy:#3de8f5;--mg:#e94cf0;--vi:#b44cff;--ok:#5dffa8;
--gc:0 0 8px rgba(61,232,245,.6),0 0 22px rgba(61,232,245,.25);--gm:0 0 8px rgba(233,76,240,.7),0 0 24px rgba(180,76,255,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif}
body{min-height:100vh;background-image:linear-gradient(rgba(61,232,245,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(61,232,245,.04) 1px,transparent 1px),radial-gradient(800px 400px at 50% -5%,rgba(180,76,255,.18),transparent 60%);background-size:36px 36px,36px 36px,auto;padding-top:env(safe-area-inset-top)}
.led{height:4px;background:linear-gradient(90deg,transparent,var(--vi),var(--mg),var(--vi),transparent);background-size:200% 100%;animation:run 2.5s linear infinite,blink 1.2s ease-in-out infinite;box-shadow:var(--gm)}
@keyframes run{to{background-position:-200% 0}}
@keyframes blink{50%{opacity:.35}}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 80px}
.top{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.top .ob{align-self:flex-end}
.brand{text-align:center}
.brand svg{height:150px;width:auto;display:block;margin:0 auto;filter:drop-shadow(0 0 7px rgba(233,76,240,.75))}
.brand b{display:block;font:500 clamp(34px,9vw,60px) Cinzel,Georgia,serif;letter-spacing:.12em;line-height:1.1;color:var(--cy);text-shadow:0 0 6px rgba(61,232,245,.9),0 0 22px rgba(61,232,245,.45);margin-top:6px}
.brand .ln{width:min(520px,80vw);height:14px;margin:4px auto 6px;display:block}
.brand small{font:300 clamp(11px,3vw,16px) Jost,sans-serif;letter-spacing:.5em;color:#8fdde6;text-shadow:0 0 8px rgba(61,232,245,.4)}
.ob{font:11px ui-monospace,Consolas,monospace;padding:6px 12px;border-radius:20px;border:1px solid var(--mg);color:var(--mg);box-shadow:0 0 10px rgba(233,76,240,.3);display:inline-flex;gap:7px;align-items:center}
.ob i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;animation:blink 1.6s infinite}
.ob.on{border-color:var(--ok);color:var(--ok);box-shadow:0 0 12px rgba(93,255,168,.35)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 18px}
.btn{font:700 13px ui-monospace,Consolas,monospace;padding:11px 16px;min-height:42px;border-radius:8px;border:1px solid var(--ln);background:transparent;color:var(--dim);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--cy);color:var(--cy);box-shadow:var(--gc)}
.btn.pri{background:linear-gradient(135deg,var(--mg),var(--vi));border-color:var(--mg);color:#fff;box-shadow:var(--gm);margin-right:auto}
.btn.pri:hover{filter:brightness(1.15);color:#fff}
.btn.on{border-color:var(--cy);color:var(--cy);box-shadow:var(--gc)}
.btn.dan{border-color:rgba(255,90,110,.5);color:#ff6b7e}
.btn.dan:hover{border-color:#ff6b7e;color:#ff6b7e;box-shadow:0 0 10px rgba(255,90,110,.5)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:16px 16px 14px;cursor:pointer;position:relative;transition:.2s;--c:var(--mg)}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c);box-shadow:0 0 10px var(--c)}
.card:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 40%,transparent)}
.card.andamento{--c:var(--cy)}.card.concluido{--c:var(--ok)}
.card h3{margin:0 0 6px;font-size:16px;line-height:1.3}
.card p{margin:0 0 12px;color:var(--dim);font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .ft{display:flex;justify-content:space-between;align-items:center;font:11px ui-monospace,monospace;color:var(--dim)}
.tag{padding:3px 10px;border-radius:12px;border:1px solid var(--c);color:var(--c);text-shadow:0 0 6px var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:var(--dim)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto;z-index:50}
.mo[hidden]{display:none}
.md{background:var(--p);border:1px solid var(--vi);box-shadow:var(--gm);border-radius:14px;width:100%;max-width:520px;padding:20px}
.md h2{margin:0 0 14px;font-size:14px;letter-spacing:.12em;color:var(--mg);text-transform:uppercase;text-shadow:0 0 8px var(--mg)}
label{display:block;font:11.5px ui-monospace,monospace;color:var(--dim);margin:12px 0 6px}
input,textarea{width:100%;background:#060d12;border:1px solid var(--ln);border-radius:8px;color:var(--ink);font:inherit;font-size:15px;padding:11px 12px;outline:none;color-scheme:dark}
input:focus,textarea:focus{border-color:var(--cy);box-shadow:var(--gc)}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.row .btn{flex:1}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.st .btn{padding:10px 4px;font-size:12px}
.st .btn[data-s=pendente].on{border-color:var(--mg);color:var(--mg);box-shadow:var(--gm)}
.st .btn[data-s=concluido].on{border-color:var(--ok);color:var(--ok);box-shadow:0 0 10px rgba(93,255,168,.5)}
.card .im{height:120px;margin:-4px -4px 10px;border-radius:8px;overflow:hidden;position:relative;background:#060d12}
.card .im img{width:100%;height:100%;object-fit:cover;display:block}
.card .im span{position:absolute;right:6px;bottom:6px;font:11px ui-monospace,monospace;background:rgba(4,7,11,.85);color:var(--cy);border:1px solid var(--cy);border-radius:10px;padding:2px 8px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:12px}
.gal div{position:relative;border:1px solid var(--ln);border-radius:8px;overflow:hidden;aspect-ratio:1}
.gal img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.gal button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:1px solid #ff6b7e;background:rgba(4,7,11,.85);color:#ff6b7e;cursor:pointer}
#lbi{max-width:100%;max-height:88vh;margin:auto;border-radius:10px;box-shadow:var(--gc)}
.det{white-space:pre-wrap;color:var(--dim);font-size:14px;line-height:1.5;background:#060d12;border:1px solid var(--ln);border-radius:8px;padding:12px}
</style>
</head>
<body>
<div class="led"></div>
<div class="wrap">
  <div class="top">
    <span class="ob" id="ob"><i></i>conectando...</span>
    <div class="brand">
      <svg viewBox="205 245 640 580" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <ellipse cx="550" cy="808" rx="70" ry="9" fill="#3de8f5" opacity=".35"/>
        <g fill="rgba(180,76,255,.32)" stroke="none"><path d="M547 265 611 413 567 428 545 350Z"/><path d="M428 467 449 521 480 591 370 635Z"/><path d="M370 635 480 591 449 708Z"/><path d="M649 459 721 599 724 685 601 571 625 516Z"/><path d="M655 690 724 685 680 747 610 807Z"/></g>
        <g stroke="#3de8f5" stroke-width="5"><path d="M491 807H450L420 778H227V640"/><path d="M370 635 343 602V558L372 529V498"/><path d="M724 659 768 629V579L795 551"/><path d="M724 685H762"/><path d="M610 807H657L686 782H737"/></g>
        <g stroke="#b44cff" stroke-width="5"><path d="M385 713 359 740H294L271 717V660L301 630V559"/><path d="M691 536 731 518V442L760 414V373"/><path d="M739 553V478"/><path d="M724 599 777 548V458L825 410"/></g>
        <g stroke="#3de8f5" stroke-width="5" fill="#04070b"><circle cx="227" cy="631" r="9"/><circle cx="372" cy="489" r="9"/><circle cx="800" cy="546" r="9"/><circle cx="771" cy="686" r="9"/><circle cx="746" cy="782" r="9"/></g>
        <g stroke="#b44cff" stroke-width="5" fill="#04070b"><circle cx="301" cy="550" r="9"/><circle cx="760" cy="364" r="9"/><circle cx="739" cy="469" r="9"/><circle cx="833" cy="402" r="9"/></g>
        <g stroke="#ee50f5" stroke-width="7"><path d="M547 265 611 413 625 516 649 459 721 599 724 685 680 747 610 807M491 807 415 755 370 635 428 467 449 521 470 450 545 350 547 265"/></g>
        <g stroke="#ee50f5" stroke-width="5"><path d="M545 350 567 428 611 413M545 350 509 485M470 450 509 485 571 592 601 571 625 516M428 467 449 521 480 591 449 708 491 807M480 591 449 708 415 755M370 635 449 708M601 571 724 685M601 571 655 690 724 685M655 690 610 807M655 690 680 747M601 571 649 459"/></g>
        <path d="M370 635 480 591 509 485 567 428" stroke="#c9d8ff" stroke-width="5"/>
        <g fill="#fff"><circle cx="547" cy="265" r="8"/><circle cx="480" cy="591" r="7"/><circle cx="491" cy="807" r="7"/><circle cx="610" cy="807" r="7"/></g>
      </svg>
      <b>PROMETEUS</b>
      <svg class="ln" viewBox="0 0 520 14" fill="none" stroke="#3de8f5" stroke-width="1.6"><path d="M9 7H210L222 13H298L310 7H511"/><circle cx="7" cy="7" r="5" fill="#04070b"/><circle cx="513" cy="7" r="5" fill="#04070b"/></svg>
      <small>FERRAMENTAS DIGITAIS</small>
    </div>
  </div>

  <div class="bar">
    <button class="btn pri" id="novo">+ Nova ação</button>
    <button class="btn on" data-f="todos">Todas <span id="c-todos">0</span></button>
    <button class="btn" data-f="pendente">Pendente <span id="c-pendente">0</span></button>
    <button class="btn" data-f="andamento">Em andamento <span id="c-andamento">0</span></button>
    <button class="btn" data-f="concluido">Concluído <span id="c-concluido">0</span></button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- Modal: nova ação -->
<div class="mo" id="mNovo" hidden><div class="md">
  <h2>Nova ação</h2>
  <label>Título *</label><input id="t" placeholder="Ex.: Enviar proposta ao cliente">
  <label>Descrição</label><textarea id="d" placeholder="Detalhes da ação..."></textarea>
  <label>Prazo</label><input type="date" id="p">
  <label>Imagens</label><button class="btn" id="anx" type="button" style="width:100%">📎 Anexar imagens</button>
  <input type="file" id="fi" accept="image/*" multiple hidden><div class="gal" id="gN"></div>
  <div class="row"><button class="btn" data-x>Cancelar</button><button class="btn pri" id="salvar" style="margin:0">Criar ação</button></div>
</div></div>

<!-- Modal: detalhe da ação -->
<div class="mo" id="mDet" hidden><div class="md">
  <h2 id="dt"></h2>
  <div class="det" id="dd"></div>
  <div class="gal" id="gD"></div>
  <div class="st">
    <button class="btn" data-s="pendente">Pendente</button>
    <button class="btn" data-s="andamento">Em andamento</button>
    <button class="btn" data-s="concluido">Concluído</button>
  </div>
  <input type="file" id="fi2" accept="image/*" multiple hidden>
  <div class="row"><button class="btn" id="anx2">📎 Anexar</button><button class="btn dan" id="del">Excluir</button><button class="btn" data-x>Fechar</button></div>
</div></div>

<div class="mo" id="lb" hidden><img id="lbi" alt=""></div>
<script>
(function(){
"use strict";
/* ===== SUPABASE: cole sua URL e chave publicável aqui ===== */
var SUPABASE_URL='https://kwewmzgxblrjcazeenvf.supabase.co';
var SUPABASE_KEY='sb_publishable_3--6HD8l355NKXrPW7DLxw_z7Lo9xzN';
var TIPO="acoes_prometeus"; /* tabela: dados_sistema (id text PK, tipo text, conteudo jsonb, atualizado_em timestamptz) */

var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var NOME={pendente:"Pendente",andamento:"Em andamento",concluido:"Concluído"};
var KEY="prometeus_acoes_v1",A=[],sb=null,ON=false,filtro="todos",atual=null;

function cache(){try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}}
function badge(){var o=$("ob");o.className="ob"+(ON?" on":"");o.innerHTML="<i></i>"+(ON?"Online — banco conectado":"Modo local — só neste navegador")}

/* ---- banco ---- */
async function conectar(){
  try{
    if(window.supabase&&SUPABASE_URL.indexOf("http")===0){
      sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
      var t=await sb.from("dados_sistema").select("id").limit(1);
      if(t.error)throw t.error;ON=true;
    }
  }catch(e){console.error(e);sb=null;ON=false}
  badge();
}
async function dbSave(a){if(!ON)return;try{var r=await sb.from("dados_sistema").upsert({id:a.id,tipo:TIPO,conteudo:a,atualizado_em:new Date().toISOString()});if(r.error)throw r.error}catch(e){console.error(e);alert("Salvo localmente, mas falhou no banco online.")}}
async function dbDel(id){if(!ON)return;try{await sb.from("dados_sistema").delete().eq("id",id)}catch(e){console.error(e)}}
async function sync(){
  if(!ON)return;
  try{var r=await sb.from("dados_sistema").select("conteudo").eq("tipo",TIPO);
    if(r.error)throw r.error;
    var rem=r.data.map(function(x){return x.conteudo});
    if(rem.length||!A.length){A=rem;cache()}
    else{for(var i=0;i<A.length;i++)await dbSave(A[i])} /* envia dados locais na 1ª vez */
  }catch(e){console.error(e)}
  render();
}

/* ---- tela ---- */
function render(){
  var c={todos:A.length,pendente:0,andamento:0,concluido:0};
  A.forEach(function(a){c[a.status]++});
  for(var k in c)$("c-"+k).textContent=c[k];
  var l=A.filter(function(a){return filtro==="todos"||a.status===filtro}).sort(function(a,b){return b.criado<a.criado?-1:1});
  $("grid").innerHTML=l.length?l.map(function(a){
    var f=a.fotos||[];
    return '<div class="card '+a.status+'" data-id="'+a.id+'">'+(f.length?'<div class="im"><img src="'+f[0]+'" alt=""><span>📷 '+f.length+'</span></div>':'')+'<h3>'+esc(a.titulo)+'</h3><p>'+(esc(a.desc)||"Sem descrição")+'</p><div class="ft"><span>'+(a.prazo?"Prazo "+a.prazo.split("-").reverse().join("/"):"Sem prazo")+'</span><span class="tag">'+NOME[a.status]+'</span></div></div>';
  }).join(""):'<div class="empty">Nenhuma ação aqui. Clique em <b>+ Nova ação</b>.</div>';
}
function abrirDet(id){
  atual=A.filter(function(a){return a.id===id})[0];if(!atual)return;
  $("dt").textContent=atual.titulo;
  $("dd").textContent=(atual.desc||"Sem descrição")+(atual.prazo?"\n\nPrazo: "+atual.prazo.split("-").reverse().join("/"):"");
  marca();gal();$("mDet").hidden=false;
}
/* ---- imagens (comprimidas e guardadas junto da ação) ---- */
var nf=[];
function comp(f){return new Promise(function(res){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.7))};im.onerror=function(){res(null)};im.src=r.result};r.onerror=function(){res(null)};r.readAsDataURL(f)})}
async function ler(fs){var o=[];for(var i=0;i<fs.length;i++){var d=await comp(fs[i]);if(d)o.push(d)}return o}
function gh(a){return a.map(function(s,i){return '<div><img src="'+s+'" data-z="'+i+'" alt=""><button data-r="'+i+'">&times;</button></div>'}).join("")}
function gal(){$("gD").innerHTML=gh(atual.fotos||[])}
function zoom(e,arr){var z=e.target.dataset.z;if(z!=null){$("lbi").src=arr[+z];$("lb").hidden=false}}
$("anx").onclick=function(){$("fi").click()};
$("fi").onchange=async function(){nf=nf.concat(await ler(this.files));this.value="";$("gN").innerHTML=gh(nf)};
$("gN").onclick=function(e){var r=e.target.dataset.r;if(r!=null){nf.splice(+r,1);$("gN").innerHTML=gh(nf)}else zoom(e,nf)};
$("anx2").onclick=function(){$("fi2").click()};
$("fi2").onchange=async function(){atual.fotos=(atual.fotos||[]).concat(await ler(this.files));this.value="";cache();render();gal();dbSave(atual)};
$("gD").onclick=function(e){var r=e.target.dataset.r;if(r!=null){atual.fotos.splice(+r,1);cache();render();gal();dbSave(atual)}else zoom(e,atual.fotos||[])};
$("lb").onclick=function(){this.hidden=true};
function marca(){document.querySelectorAll("#mDet .st .btn").forEach(function(b){b.classList.toggle("on",b.dataset.s===atual.status)})}

/* ---- eventos ---- */
$("grid").onclick=function(e){var c=e.target.closest(".card");if(c)abrirDet(c.dataset.id)};
$("novo").onclick=function(){$("t").value=$("d").value=$("p").value="";nf=[];$("gN").innerHTML="";$("mNovo").hidden=false;$("t").focus()};
$("salvar").onclick=function(){
  var t=$("t").value.trim();if(!t){$("t").focus();return}
  var a={id:"a"+Date.now().toString(36),titulo:t,desc:$("d").value.trim(),prazo:$("p").value,fotos:nf.slice(),status:"pendente",criado:new Date().toISOString()};
  A.push(a);cache();render();dbSave(a);$("mNovo").hidden=true;
};
document.querySelectorAll("#mDet .st .btn").forEach(function(b){b.onclick=function(){
  atual.status=b.dataset.s;cache();render();marca();dbSave(atual);
}});
$("del").onclick=function(){if(confirm('Excluir "'+atual.titulo+'"?')){A=A.filter(function(a){return a!==atual});cache();render();dbDel(atual.id);$("mDet").hidden=true}};
document.querySelectorAll("[data-x]").forEach(function(b){b.onclick=function(){$("mNovo").hidden=$("mDet").hidden=true}});
document.querySelectorAll(".mo").forEach(function(m){m.onclick=function(e){if(e.target===m)m.hidden=true}});
document.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){
  filtro=b.dataset.f;document.querySelectorAll("[data-f]").forEach(function(x){x.classList.toggle("on",x===b)});render();
}});

/* ---- início ---- */
try{A=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){A=[]}
render();
conectar().then(sync);
setInterval(sync,30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)sync()});
})();
</script>
</body>
</html>
